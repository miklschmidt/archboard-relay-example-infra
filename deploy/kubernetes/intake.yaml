apiVersion: apps/v1
kind: Deployment
metadata:
  name: intake
  labels:
    app.kubernetes.io/name: intake
    app.kubernetes.io/part-of: harbor-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: intake
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intake
        app.kubernetes.io/part-of: harbor-relay
    spec:
      containers:
        - name: intake
          image: example.invalid/harbor-relay/intake:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: peer-endpoints
          readinessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: intake
  labels:
    app.kubernetes.io/name: intake
    app.kubernetes.io/part-of: harbor-relay
spec:
  selector:
    app.kubernetes.io/name: intake
  ports:
    - name: http
      port: 8080
      targetPort: http
