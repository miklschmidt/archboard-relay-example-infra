apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
  labels:
    app.kubernetes.io/name: dispatcher
    app.kubernetes.io/part-of: harbor-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dispatcher
        app.kubernetes.io/part-of: harbor-relay
    spec:
      containers:
        - name: dispatcher
          image: example.invalid/harbor-relay/dispatcher:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: peer-endpoints
          readinessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: dispatcher
  labels:
    app.kubernetes.io/name: dispatcher
    app.kubernetes.io/part-of: harbor-relay
spec:
  selector:
    app.kubernetes.io/name: dispatcher
  ports:
    - name: http
      port: 8080
      targetPort: http
