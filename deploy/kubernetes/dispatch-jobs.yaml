apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch-jobs
  labels:
    app.kubernetes.io/name: dispatch-jobs
    app.kubernetes.io/part-of: harbor-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dispatch-jobs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dispatch-jobs
        app.kubernetes.io/part-of: harbor-relay
    spec:
      containers:
        - name: dispatch-jobs
          image: example.invalid/harbor-relay/dispatch-jobs:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9324
          readinessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: dispatch-jobs
  labels:
    app.kubernetes.io/name: dispatch-jobs
    app.kubernetes.io/part-of: harbor-relay
spec:
  selector:
    app.kubernetes.io/name: dispatch-jobs
  ports:
    - name: http
      port: 9324
      targetPort: http
